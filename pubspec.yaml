name: daily_hoseinoori
description: |
  پلتفرم مدیریت زندگی، زمان و وظایف - آفلاین و چندسکویی
  Life Management Platform – Offline & Cross-Platform
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── پایگاه داده / Database ──────────────────────────
  # Drift: SQLite ORM تایپ‌سیف برای Flutter
  drift: ^2.22.1
  # درایور SQLite برای پلتفرم‌های موبایل و دسکتاپ
  sqlite3_flutter_libs: ^0.5.24
  # مسیریابی فایل‌های محلی برای database path
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── شناسه‌گذاری / IDs ────────────────────────────────
  # تولید UUID برای کلیدهای اصلی جداول
  uuid: ^4.4.2

  # ── تایپوگرافی و فونت / Typography ──────────────────
  # فونت Vazirmatn فارسی از Google Fonts
  google_fonts: ^6.2.1

  # ── ابزارهای عمومی / Utilities ───────────────────────
  # مدیریت حالت ساده برای لایه اول
  provider: ^6.1.2
  # قالب‌بندی تاریخ و زمان
  intl: ^0.19.0
  # آیکون‌های مدرن Material 3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── ابزارهای توسعه / Dev Tools ───────────────────────
  # کد جنریشن برای Drift
  drift_dev: ^2.22.1
  build_runner: ^2.4.12
  # لینتر استاندارد فلاتر
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ── فونت‌های محلی / Local Fonts ──────────────────────
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf
          weight: 700

  # ── دارایی‌های استاتیک / Assets ──────────────────────
  assets:
    - assets/data/persian_events.json
    - assets/fonts/Vazirmatn/
